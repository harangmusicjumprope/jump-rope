<!-- Supabase SDK 및 로그인 통합 스크립트 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wyniunfktsylkldicpda.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5bml1bmZrdHN5bGtsZGljcGRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEzNTI1MjIsImV4cCI6MjA1NjkyODUyMn0.본인실제ANON키';

  // 스크립트 로드 후 클라이언트 생성
  function getClient() {
    if (window.supabaseClient) return window.supabaseClient;
    if (window.supabase) {
      window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return window.supabaseClient;
    }
    return null;
  }

  // 페이지 로드 시 세션 확인
  document.addEventListener('DOMContentLoaded', async () => {
    setTimeout(async () => {
      const client = getClient();
      if (!client) return;

      const { data: { session } } = await client.auth.getSession();
      if (session) {
        await verifyUserProfile(session.user);
      } else {
        const modal = document.getElementById('login-modal');
        if (modal) modal.style.display = 'flex';
      }
    }, 500);
  });

  // 로그인 버튼 클릭 시 실행
  async function handleLogin() {
    const emailEl = document.getElementById('login-email');
    const passEl = document.getElementById('login-password');
    const errorEl = document.getElementById('login-error');

    if (!emailEl || !passEl) return;

    const email = emailEl.value;
    const password = passEl.value;

    if (errorEl) errorEl.style.display = 'none';

    const client = getClient();
    if (!client) {
      alert('Supabase 연동 준비 중입니다. 잠시 후 다시 시도해 주세요.');
      return;
    }

    const { data, error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      alert('로그인 실패: ' + error.message);
      if (errorEl) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      }
    } else {
      await verifyUserProfile(data.user);
    }
  }

  // 프로필 권한 확인 및 메인 화면 진입
  async function verifyUserProfile(user) {
    const client = getClient();
    const { data: profile, error } = await client
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .single();

    if (error || !profile || !profile.is_active) {
      alert('계정이 비활성화되었거나 권한 정보가 없습니다.');
      await client.auth.signOut();
      const modal = document.getElementById('login-modal');
      if (modal) modal.style.display = 'flex';
      return;
    }

    // 로그인 성공 시 모달 닫기
    const modal = document.getElementById('login-modal');
    if (modal) modal.style.display = 'none';
  }
</script>
