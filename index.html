<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>하랑음악줄넘기 관리</title>
  <style>
    html { background: #f6f7fa; }
    body { margin: 0; background: #f6f7fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .editbtn { border: 0; background: #f1f5ff; color: #357ded; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
    .leavebtn { border: 0; background: #fff7e8; color: #d97706; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
    .student-actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .status-active { background: #eef7ee; color: #287a28; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    .status-inactive { background: #fef2f2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
  </style>
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">
    <header class="top" style="padding: 15px; background: white; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;">
      <div><b>하랑음악줄넘기</b> <small id="user-role-badge" style="background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-size: 11px;"></small></div>
      <button onclick="handleLogout()" style="background: #f3f4f6; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">로그아웃</button>
    </header>

    <main style="padding: 15px;">
      <section id="home" class="screen active">
        <div class="hero" style="margin-bottom: 20px;">
          <div><small>오늘의 수업</small><h2>하랑음악줄넘기 출석 및 기록 관리</h2></div>
        </div>
        <div class="stats" style="display: flex; gap: 10px; margin-bottom: 20px;">
          <article style="background: white; padding: 15px; border-radius: 8px; flex: 1; text-align: center;">
            <small>전체 학생</small>
            <h3 id="total-students-count" style="margin: 5px 0 0 0;">-</h3>
          </article>
        </div>
      </section>
    </main>
  </div>

  <!-- Supabase 연동 및 로그인 스크립트 -->
  <script>
    const SUPABASE_URL = 'https://wyniunfktsylkldicpda.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9';

    let supabaseClient = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await checkAuthSession();
      }
    });

    async function checkAuthSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        await verifyUserProfile(session.user);
      } else {
        document.getElementById('login-modal').style.display = 'flex';
      }
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert('로그인 실패: ' + error.message);
      } else {
        await verifyUserProfile(data.user);
      }
    }

    async function verifyUserProfile(user) {
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .single();

      if (error || !profile || !profile.is_active) {
        alert('계정이 비활성화되었거나 권한이 없습니다.');
        await supabaseClient.auth.signOut();
        document.getElementById('login-modal').style.display = 'flex';
        return;
      }

      // 프로필 확인 완료 후 로그인 창 닫기
      document.getElementById('login-modal').style.display = 'none';
      
      const roleBadge = document.getElementById('user-role-badge');
      if (roleBadge) {
        roleBadge.textContent = profile.role === 'owner' ? '관장' : '직원';
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }
  </script>

  <!-- 로그인 모달 화면 -->
  <div id="login-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center;">
      <h3 style="margin-top: 0; color: #333;">하랑음악줄넘기 로그인</h3>
      <input type="email" id="login-email" placeholder="이메일 입력" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
      <input type="password" id="login-password" placeholder="비밀번호 입력" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
      <button onclick="handleLogin()" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">로그인</button>
    </div>
  </div>
</body>
</html>
